[project]
name = "sitiame_sport"
authors = [
    { name = "Sitiame Capital", email = "contact@sitiame-capital.com" },
]
description = "Icone d'accueil et espace de travail pour la gestion du Club Sportif (membres, cotisations, evenements)."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0"
erpnext = ">=15.0.0"
